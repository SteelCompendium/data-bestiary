content: "At the start of any elemental's turn, you can spend [Malice](scc:mcdm.monsters.v1/rule.monster/malice) to activate one of the following features.\n\n> ⭐️ **Elemental Swap (3 [Malice](scc:mcdm.monsters.v1/rule.monster/malice))**\n>\n> Two elementals on the encounter map [teleport](scc:mcdm.heroes.v1/movement/teleport) to swap places, and each has damage immunity 2 until the end of the round.\n\n> \U0001F464 **Split (5 [Malice](scc:mcdm.monsters.v1/rule.monster/malice))**\n>\n> An elemental acting this turn cleaves themself into two separate elementals. Each elemental has the same statistics as the original, except that each has half the original's current Stamina and is one size smaller. Both elementals can then [shift](scc:mcdm.heroes.v1/movement/shifting) up to their speed.\n\n> \U0001F3F9 **Convocation of Chaos (7 [Malice](scc:mcdm.monsters.v1/rule.monster/malice))**\n>\n> | **Magic, Ranged** |                 **Maneuver** |\n> |-------------------|-----------------------------:|\n> | **\U0001F4CF Ranged 8**   | **\U0001F3AF Self or one elemental** |\n>\n> **Effect:** Until the end of the encounter, the target has a +5 bonus to speed and a +5 damage bonus to strikes. Additionally, whenever an elemental within the target's line of effect uses an ability with \"Convocation\" in the name, the target also gains the effects of that ability."
name: Elemental Malice
scc: mcdm.monsters.v1/monster.elementals/elemental-malice
type: featureblock
