      usage: Main action
    - effects:
        - effect: While the shieldbearer is [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to their mentor, both have a +1 bonus to [stability](scc.v1:mcdm.heroes.v1/rule.character/stability), have [cover](scc.v1:mcdm.heroes.v1/rule.combat/cover), and grant [cover](scc.v1:mcdm.heroes.v1/rule.combat/cover) to allies.
      feature_type: trait
      icon: ⭐️
      name: Shield, Boss?
      type: feature
    - cost: Encounter
      distance: Ranged 5
      effects:
        - effect: |-
            **Trigger:** The mentor takes damage from a strike while within distance.
            **Effect:** The shieldbearer blocks the [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike) (if [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) to the mentor) or throws their shield into the mentor's space. The triggering [strike](scc.v1:mcdm.heroes.v1/rule.combat/strike)'s damage is halved and the [potency](scc.v1:mcdm.heroes.v1/rule.character/potency) of any [potency](scc.v1:mcdm.heroes.v1/rule.character/potency) effects is reduced by 1. If the shieldbearer threw their shield, it bounces back to their hand.
      feature_type: ability
      icon: ❗️
      keywords:
        - Ranged
      name: Shield Block
      target: The shieldbearer's mentor
      type: feature
      usage: Triggered action
    - distance: Melee 1
      effects:
        - effect: '**Effect:** The shieldbearer straps their shield on their back and climbs onto their mentor''s back, entering the mentor''s space. While the shieldbearer is on their mentor''s back, each of them gains 10 [temporary Stamina](scc.v1:mcdm.heroes.v1/rule.health/temporary-stamina) and can use Shield Block as a triggered action targeting an ally instead of the shieldbearer''s mentor. Additionally, the shieldbearer moves with the mentor, and they can''t use main actions, maneuvers, or move actions except to end this effect as a maneuver. The effect also ends if the shieldbearer is [force moved](scc.v1:mcdm.heroes.v1/movement/forced-movement) away from their mentor or knocked [prone](scc.v1:mcdm.heroes.v1/condition/prone). If the shieldbearer is still in their mentor''s space when the effect ends, they move into an [adjacent](scc.v1:mcdm.heroes.v1/rule.combat/adjacent) unoccupied space of their choice.'
      feature_type: ability
      icon: "\U0001F5E1"
      keywords:
        - Melee
      name: Living Backpack
      target: The shieldbearer's mentor
      type: feature
      usage: Main action
    - cost: Encounter
